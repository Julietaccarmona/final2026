<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Información de Perfil Simple</title>

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  </head>

  <body>
    <div id="app">
      <h1>Información de Perfil</h1>

      <p>Nombre: {{ nombre }}</p>
      <p>Edad: {{ edad }}</p>
      <p>Ciudad: {{ ciudad }}</p>

      <p>
        Hola, mi nombre es {{ nombre }}, tengo {{ edad }} años y vivo en {{
        ciudad }}.
      </p>

      <h1>Contador Interactivo</h1>

      <p>Contador: {{ contador }}</p>

      <button @click="incrementar">Incrementar</button>
      <button @click="decrementar">Decrementar</button>
    </div>

    <script>
      new Vue({
        el: "#app",

        data: {
          nombre: "Raúl Pérez",
          edad: 63,
          ciudad: "Buenos Aires",
          contador: 0,
          nuevaTarea: "",
          tareas: [
            {
              id: 1,
              texto: "Aprender Vue",
              completada: false,
            },
          ],
        },

        methods: {
          incrementar() {
            this.contador += 2;
          },

          decrementar() {
            this.contador--;
          },
        },
      });
    </script>
  </body>
</html>
